name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test and build portable exes
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: AlexbedHyperCopy
          path: dist/*
